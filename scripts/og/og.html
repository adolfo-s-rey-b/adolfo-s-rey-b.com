<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Source Serif 4';
        src: url('../../src/fonts/source-serif-4/roman.woff2') format('woff2');
        font-weight: 200 900;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1200px;
        height: 630px;
        background: #FDFDFC;
        font-family: 'Source Serif 4', Georgia, serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 96px;
      }
      h1 { font-size: 84px; font-weight: 600; color: #1A1A1A; letter-spacing: -0.01em; }
      hr { border: 0; border-top: 1px solid #E5E3DF; margin: 36px 0; }
      p  { font-size: 34px; color: #6B6B6B; line-height: 1.35; }
      .site { font-size: 26px; color: #7A1E1E; margin-top: 40px; }
    </style>
  </head>
  <body>
    <h1>Adolfo S. Rey B.</h1>
    <hr />
    <p id="descriptor">Economist and lawyer · Universidad de los Andes</p>
    <p class="site">adolfo-s-rey-b.com</p>

    <script>
      // ?l=es cambia el descriptor. Los textos son los mismos del §7.1.
      const params = new URLSearchParams(location.search);
      if (params.get('l') === 'es') {
        document.getElementById('descriptor').textContent =
          'Economista y abogado · Universidad de los Andes';
      }
    </script>
  </body>
</html>
